[project]
name = "tiktok-orders-pipeline"
version = "0.1.0"
description = "Multi-channel e-commerce data pipeline (TikTok Shop & Shopee Vietnam)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
    "dagster>=1.8.0",
    "dagster-webserver>=1.8.0",
    "dagster-dbt>=0.24.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "streamlit>=1.38.0",
    "plotly>=5.24.0",
    "polars>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
