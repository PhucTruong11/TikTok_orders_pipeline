version: 2
models:
- name: int_tiktok_observations
  description: One mapped observation per source CSV record; status seed joins must
    not multiply rows.
  columns:
  - name: observation_id
    data_tests:
    - not_null
    - unique
    - relationships:
        arguments:
          to: ref('stg_tiktok_orders')
          field: observation_id
  - name: standardized_status
    data_tests:
    - not_null
  - name: status_group
    data_tests:
    - not_null
  - name: is_status_mapped
    data_tests:
    - accepted_values:
        arguments:
          values:
          - true
          quote: false
- name: int_orders_deduped
  description: 'Deprecated name, preserved lineage: full observation passthrough,
    without dedup or incremental watermark.'
  columns:
  - name: observation_id
    data_tests:
    - not_null
    - unique
    - relationships:
        arguments:
          to: ref('stg_tiktok_orders')
          field: observation_id
- name: fct_tiktok_observations
  description: Observation fact, NOT an order or unique product fact. Header money
    is non-additive. Reported amount less selected components is NOT seller payout/profit.
  columns:
  - name: observation_id
    data_tests:
    - not_null
    - unique
    - relationships:
        arguments:
          to: ref('stg_tiktok_orders')
          field: observation_id
- name: fct_order_items
  description: Compatibility view of fct_tiktok_observations. Use observation_id,
    not masked order_id, in joins.
  columns:
  - name: observation_id
    data_tests:
    - not_null
    - unique
    - relationships:
        arguments:
          to: ref('stg_tiktok_orders')
          field: observation_id
