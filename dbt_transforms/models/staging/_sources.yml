version: 2

sources:
  - name: raw_tiktok
    description: "Immutable DataGrip CSV snapshot; identifiers are privacy masks, not business keys."
    tables:
      - name: tiktok_orders
        description: "One exported CSV observation. No order identity is inferred from masked IDs."
        config:
          meta:
            external_location: >-
              read_csv('{{ env_var("TIKTOK_CSV_PATH", "../data/raw/tiktok_orders.csv") | replace("'", "''") }}', all_varchar=true, parallel=false)
