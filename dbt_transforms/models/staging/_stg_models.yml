version: 2
models:
- name: stg_tiktok_orders
  description: One immutable CSV observation. Masked IDs are preserved labels, never
    business keys. Strict casts fail on invalid input.
  columns:
  - name: observation_id
    description: SHA-256 of channel, whole-file SHA-256 and CSV record ordinal; stable
      for the same snapshot.
    data_tests:
    - not_null
    - unique
  - name: _source_row_number
    description: One-based record ordinal, independent of embedded newlines.
    data_tests:
    - not_null
    - unique
    - positive_value
  - name: _file_sha256
    data_tests:
    - not_null
  - name: pk_id
    description: Privacy mask from source; uniqueness is not expected.
    data_tests:
    - not_null
  - name: order_id
    description: Privacy mask; distinct values do not measure business orders.
    data_tests:
    - not_null
  - name: raw_order_status
    data_tests:
    - not_null
  - name: order_status
    description: Trimmed uppercase status; CANCELED normalized to CANCELLED.
    data_tests:
    - not_null
  - name: created_time
    data_tests:
    - not_null
  - name: quantity
    data_tests:
    - not_null
    - positive_value
  - name: total_amount
    description: Reported header amount repeated on observations; not additive over
      rows.
    data_tests:
    - not_null
    - nonnegative_value
  - name: item_sale_price
    data_tests:
    - not_null
    - nonnegative_value
  - name: item_original_price
    data_tests:
    - not_null
    - nonnegative_value
  - name: currency
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - VND
          - SGD
  - name: source_channel
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - tiktok
