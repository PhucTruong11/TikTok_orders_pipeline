ecom_pipeline:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: '{{ var(''warehouse_path'', env_var(''DBT_DUCKDB_PATH'', ''../data/duckdb/ecom_medallion.duckdb''))
        }}'
      threads: 4
    ci:
      type: duckdb
      path: '{{ var(''warehouse_path'', env_var(''DBT_DUCKDB_PATH'', ''../data/duckdb/ecom_medallion.duckdb''))
        }}'
      threads: 2
    prod:
      type: duckdb
      path: '{{ var(''warehouse_path'', env_var(''DBT_DUCKDB_PATH'', ''../data/duckdb/ecom_medallion.duckdb''))
        }}'
      threads: 4
