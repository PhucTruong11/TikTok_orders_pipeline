name: CI Data Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "requirements.txt"

      - name: Install Dependencies
        run: uv pip install --system -r requirements.txt

      - name: Check Python Syntax (Dagster)
        run: |
          python -m py_compile pipeline_orchestration/definitions.py

      - name: dbt build and regression checks (synthetic TikTok fixture)
        run: python scripts/validate_tiktok_dbt.py

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-dbt-validation
          include-hidden-files: true
          path: |
            .validation/latest_validation.json
            .validation/**/run_results.json
            .validation/**/command_output.txt
